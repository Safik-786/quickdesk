services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quickdesk
    volumes:
      - quickdesk_pg_data:/var/lib/postgresql/data

volumes:
  quickdesk_pg_data:
